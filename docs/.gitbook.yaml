# GitBook configuration for the Honua Console documentation.
#
# SUMMARY.md is GENERATED from the OKF bundle by scripts/generate-summary.py,
# so the human table of contents and the agent-traversable bundle cannot
# disagree. Edit frontmatter or docs/okf-bundle.v1.json, then re-run it.
#
# Note the bundle here is deliberately small — 6 of 40 pages. The rest of
# docs/ is a design and planning corpus, marked draft/PLAN/SHELVED by its own
# authors. See boundaryNote in docs/okf-bundle.v1.json.
root: ./

structure:
  readme: console-authentication.md
  summary: SUMMARY.md

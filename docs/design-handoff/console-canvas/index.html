        </DCArtboard>
      </DCSection>

      <DCSection id="gov" title="⑩ Settings · Access, Auth, CORS, License, Catalog endpoints, About"
        subtitle="Server admin lives here, separated from authoring screens.">
        <DCArtboard id="settings" label="Settings · Auth providers + API keys + CORS + License" width={W} height={H}>
          <Settings />
        </DCArtboard>
        <DCArtboard id="settings-catalogs" label="Settings · Catalog endpoints (Esri / OGC Records / STAC — top-level on/off)" width={W} height={H}>
          <SettingsCatalogs />
        </DCArtboard>
      </DCSection>

      <DCSection id="states" title="⑪ States gallery" subtitle="Every list / detail / wizard surface needs all of these.">
        <DCArtboard id="states-gallery" label="Empty · Loading · Warning · Blocked · Partial · Success · Error · Permission · Filtered-empty" width={W} height={H}>
          <StatesGallery />
        </DCArtboard>
      </DCSection>

      <DCSection id="notes" title="Designer notes" subtitle="Decisions worth re-reading before the next round.">
        <DCArtboard id="rationale" label="Rationale" width={760} height={520}>
          <div style={{padding:'18px 22px', height:'100%', overflow:'auto', background:'#fffdf3', fontSize: 12, lineHeight: 1.55, fontFamily:'Inter, system-ui, sans-serif'}}>
            <div style={{font:'600 14px var(--ui)', marginBottom:8}}>Design decisions, grounded in the docs you sent.</div>
            <ol style={{paddingLeft:18, margin:0}}>
              <li><b>Semantic center is the Data Resource.</b> Everything else (services, publishing, access, validation) hangs off it. The brief and Metadata-v2 doc both emphasise this — services are <i>targets</i>, not owners.</li>
              <li><b>9 resource tabs, grouped Define / Publish / Operate.</b> The doc lists 8 tabs + we added Presentation (Styles/Labels/Popups/Relationships/Events/History — pulled from the BSCore workflow evidence). 9 tabs flat is unscannable; super-tabs keep the most-used 6 in Define and quarantine power-user surfaces.</li>
              <li><b>Forbidden labels live only in Advanced.</b> "storageBinding", "projectionProfile", "ABAC", "canonical graph", "distribution object", "policy condition", "runtime snapshot" — never on a primary surface. Advanced has them, badged.</li>
              <li><b>Two publishing views.</b> A) the matrix lets one operator scan the whole catalog × every format at once. B) the per-resource panel + projection preview drawer is the work surface — preview the exact GetCapabilities / STAC JSON / DCAT XML before commit, side-by-side with the canonical metadata.</li>
              <li><b>Unified Activity center.</b> Imports, publishes, refreshes, tile builds, validation runs, webhooks all live in one filterable feed. Jobs still have their own detail page (steps + logs + inputs/outputs).</li>
              <li><b>Validation is both global and per-resource.</b> Global center groups by severity + target + area. Each row deep-links to the fix location. Targets: OGC Records, DCAT, STAC, ISO 19115, Esri item, GeoServices REST, OGC API, OData.</li>
              <li><b>No tenant / org switching.</b> First-release constraint honoured everywhere.</li>
              <li><b>Drafts are first-class.</b> Every wizard saves drafts; every list shows them as their own state alongside Live/Stale/Blocked.</li>
              <li><b>Partial success matters.</b> Esri import + file import surface "2 of 3 layers OK" prominently rather than swallowing the wins because one row failed.</li>
            </ol>
            <div className="hand" style={{marginTop:14, fontFamily:'Kalam, cursive', color:'var(--pencil)', fontSize:14}}>
              next round: (a) tighten copy on every empty state, (b) try a "publish basket" pattern as a C variant on publishing, (c) wireframe the projection-preview drawer for STAC and DCAT (not just WMS).
            </div>
          </div>
        </DCArtboard>
      </DCSection>
    </DesignCanvas>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>

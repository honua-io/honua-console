<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/console/" />

    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="_content/Honua.Console.Shell/honua-console.css" />


    <link rel="icon" type="image/png" href="favicon.png" />

</head>

<body>
    <div id="app"><p role="status">Loading Honua Console…</p></div>

    <div id="blazor-error-ui" data-nosnippet>
        <span class="blazor-error-ui-text">Honua Console encountered an error.</span>
        <a href="." class="reload">Reload</a>
        <span class="dismiss" role="button" tabindex="0" aria-label="Dismiss">🗙</span>
    </div>

    <script src="js/console-theme.js"></script>
    <script src="js/navigation-state.js"></script>
    <script src="js/modal-surface.js"></script>
    <script src="js/publication-tree.js"></script>
    <script src="js/conversation-drawer.js"></script>
    <script src="_framework/blazor.webassembly.js"></script>

    <script type="module" src="js/agent-workspace.mjs"></script>
    <script type="module" src="js/studio-embed.mjs"></script>
    <script type="module" src="js/dataset-import-panel.mjs"></script>
    <script>
        // In-page section navigation: Blazor's interactive router intercepts same-page
        // "#id" links and does not scroll to the fragment, so handle pure-fragment anchors
        // here. Only acts when a matching element exists; otherwise leaves the link alone.
        // Capture phase so this runs before Blazor's delegated router handler.
        document.addEventListener('click', function (e) {
            var anchor = e.target.closest && e.target.closest('a[href^="#"]');
            if (!anchor) { return; }
            var id = anchor.getAttribute('href').slice(1);
            if (!id) { return; }
            var target = document.getElementById(id);
            if (target) {
                e.preventDefault();
                e.stopPropagation();
                target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                if (history.replaceState) { history.replaceState(null, '', '#' + id); }
            }
        }, true);
    </script>
</body>

</html>

# Adds the existing real Keycloak realm to the publishing testbed.
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: ["start", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin-live-proof-pw
      KC_HOSTNAME: https://host.docker.internal:8443
      KC_HTTP_ENABLED: "false"
      KC_HTTPS_CERTIFICATE_FILE: /opt/keycloak/certs/kc.crt
      KC_HTTPS_CERTIFICATE_KEY_FILE: /opt/keycloak/certs/kc.key
    volumes:
      - ./playwright/live-auth/certs:/opt/keycloak/certs:ro
      - ./playwright/live-auth/realm:/opt/keycloak/data/import:ro
    ports:
      - "8443:8443"
    networks:
      default:
        aliases:
          - host.docker.internal

  honua-server:
    environment:
      PUBLIC_BASE_URL: http://127.0.0.1:5274
      Oidc__Enabled: "true"
      Oidc__Generic__Enabled: "true"
      Oidc__Generic__DisplayName: "Keycloak (live proof)"
      Oidc__Generic__Authority: https://host.docker.internal:8443/realms/honua
      Oidc__Generic__ClientId: honua-console-bff
      Oidc__Generic__ClientSecret: honua-console-bff-live-proof-secret
      Authentication__OperatorBearer__Enabled: "true"
      Authentication__OperatorBearer__SigningKey: live-proof-operator-bearer-signing-key-0123456789
      # honua-server ends the admin session when the IdP access token expires
      # (AdminAuthEndpoints clamps it to expires_in). Keycloak defaults to 300 s, so with the
      # default the governed session died five minutes into a suite that takes over an hour.
      # The realm sets accessTokenLifespan to 7200 s, matching the honua-release S4 realm.
      # Bearer issuance allows 10 per minute per client IP, and every browser call reaches the
      # server from the Console host's single IP. playwright.live.config.ts already requires
      # rate limiting to be disabled for this suite, as the honua-release S4 stack does.
      RateLimiting__Enabled: "false"
      SSL_CERT_FILE: /certs/kc.crt
    volumes:
      - ./playwright/live-auth/certs:/certs:ro

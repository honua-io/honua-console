# The same published Console bits are exercised in PR CI and digest replay.
services:
  postgis:
    ports:
      - "5274:5274"
  honua-server:
    environment:
      Studio__EndUserAuthorization__Enabled: "true"
      Authentication__OperatorBearer__MaxLifetimeMinutes: "1"
      # Development does not append the Production admin rule. Mirror only that
      # role-scoped rule for the independent operator control; customer stays user-only.
      Operations__Policy__Rules__0__OperationId: "*"
      Operations__Policy__Rules__0__Role: admin
      Operations__Policy__Rules__0__Decision: Allow
      Operations__Policy__Rules__0__Reason: "Live control mirrors the Production administrator rule"
  console:
    image: ${HONUA_CONSOLE_E2E_CONSOLE_IMAGE:?Set a built Console image or immutable GHCR digest}
    network_mode: "service:postgis"
    depends_on:
      honua-server:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5274
      HONUA_SERVER_BASE_URL: http://localhost:8080
      HONUA_ADMIN_API_KEY: ""
      HONUA_CONSOLE_MODE: full
      Studio__EmbedJsStudio: "true"
      SSL_CERT_FILE: /certs/kc.crt
    volumes:
      - ./playwright/live-auth/certs:/certs:ro

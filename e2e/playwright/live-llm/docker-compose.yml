# Live-LLM smoke lane stack.
#
# Only the Bedrock provider mode needs this stack: a LiteLLM gateway that gives the
# Console's /support GIS assistant an OpenAI-compatible /v1/chat/completions
# endpoint backed by AWS Bedrock. The direct OpenAI-compatible mode needs no
# containers at all.
#
# There is no honua-server here: ADR-0076 moved generation to client-side
# inference, so the server has no inference surface to exercise. The Console's
# support assistant talks straight to the provider (HONUA_LLM_BASE_URL /
# HONUA_LLM_MODEL / HONUA_LLM_API_KEY).
#
# Host-visible port (the Console and Playwright run on the host):
#   127.0.0.1:4000  -> LiteLLM

name: honua-console-live-llm

services:
  litellm:
    # Pinned by digest (main-stable on 18 Nov 2026): a floating tag changed the
    # startup contract under the nightly lane without any change here.
    image: ghcr.io/berriai/litellm:main-stable@sha256:4295b064b22eb88f9530e616afc812edd47048891ba64896bfc3fa74e2b883c3
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./config/litellm-config.yaml:/app/config.yaml:ro
    environment:
      AWS_REGION: "${AWS_REGION:-us-west-2}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      HONUA_LIVE_LLM_BEDROCK_MODEL: "${HONUA_LIVE_LLM_BEDROCK_MODEL:-bedrock/invoke/us.anthropic.claude-haiku-4-5-20251001-v1:0}"
      # Required by LiteLLM; run-live-llm.mjs generates one per run and hands the
      # same value to the Console's support assistant as its bearer key.
      LITELLM_MASTER_KEY: "${LITELLM_MASTER_KEY:-}"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:4000/health/liveliness').status==200 else 1)\""]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

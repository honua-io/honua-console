<!doctype html><html lang="en"><head><title>Publication navigation controller fixture</title>
<link rel="stylesheet" href="/_content/Honua.Console.Shell/honua-console.css"></head><body>
<div class="console-shell"><header class="console-topbar"><a href="#outside">Outside navigation</a></header>
<div class="console-service-workspace"><div class="console-publication-navigation" data-publication-navigation data-tree-revision="0">
<button data-tree-toggle aria-expanded="false" aria-controls="console-publication-sidebar" class="console-tree-toggle">Browse services</button>
<button class="console-tree-backdrop" data-tree-backdrop hidden tabindex="-1" aria-label="Close service navigation"></button>
<aside id="console-publication-sidebar" class="console-publication-sidebar" aria-label="Service navigation">
<div class="console-tree-toolbar"><label for="filter">Filter services and loaded layers</label><input id="filter" data-tree-filter>
<button class="console-tree-close" data-tree-close>Close</button></div>
<ul role="tree" aria-label="Services and layers" class="console-publication-tree" data-publication-tree>
<li role="treeitem" tabindex="-1" aria-level="1" aria-posinset="1" aria-setsize="1" aria-expanded="true" aria-selected="false" aria-label="Services" data-publication-key="environment" data-tree-label="Services">
<div class="console-tree-row"><button data-tree-expand tabindex="-1" aria-label="Collapse Services">Expand</button><a data-tree-link tabindex="-1" href="#home">Services</a></div>
<ul role="group">
<li role="treeitem" tabindex="-1" aria-level="2" aria-posinset="1" aria-setsize="3" aria-expanded="false" aria-selected="false" aria-label="Alpha" data-publication-key="service:alpha" data-tree-label="Alpha">
<div class="console-tree-row"><button data-tree-expand tabindex="-1" aria-label="Expand Alpha">Expand</button><a data-tree-link tabindex="-1" href="#alpha">Alpha</a></div></li>
<li role="treeitem" tabindex="-1" aria-level="2" aria-posinset="2" aria-setsize="3" aria-selected="false" aria-label="Beta" data-publication-key="service:beta" data-tree-label="Beta">
<div class="console-tree-row"><span class="console-tree-spacer"></span><a data-tree-link tabindex="-1" href="#beta">Beta</a></div></li>
</ul></li></ul>
<button class="console-tree-more" data-tree-more="environment">Show more services</button>
<p role="status">Controller fixture with synthetic Alpha/Beta services; no server data.</p></aside></div>
<div class="console-workspace"><main><h1>Controller fixture</h1><a href="#main">Main action</a></main></div></div></div>
<script src="/js/publication-tree.js"></script>
<script>
 document.addEventListener('click', event => {
   const button = event.target.closest('[data-tree-expand]');
   if (button) {
     const row = button.closest('[role=treeitem]');
     const expanded = row.getAttribute('aria-expanded') === 'true';
     row.setAttribute('aria-expanded', String(!expanded));
     if (expanded) row.querySelector(':scope > [role=group]')?.remove();
     else if (row.dataset.publicationKey === 'service:alpha') {
       row.setAttribute('aria-busy', 'true');
       setTimeout(() => {
         const group = document.createElement('ul'); group.setAttribute('role', 'group');
         group.innerHTML = '<li role="treeitem" tabindex="-1" aria-level="3" aria-posinset="1" aria-setsize="1" aria-selected="false" aria-label="Bridges" data-publication-key="layer:bridges" data-tree-label="Bridges"><div class="console-tree-row"><a tabindex="-1" data-tree-link href="#bridges">Bridges</a></div></li>';
         row.removeAttribute('aria-busy'); row.append(group);
       }, 100);
     }
   }
   if (event.target.closest('[data-tree-more]')) {
     const beta = document.querySelector('[data-publication-key="service:beta"]');
     const gamma = beta.cloneNode(true);
     gamma.setAttribute('aria-label', 'Gamma'); gamma.dataset.publicationKey = 'service:gamma'; gamma.dataset.treeLabel = 'Gamma';
     gamma.setAttribute('aria-posinset', '3'); gamma.querySelector('a').textContent = 'Gamma'; gamma.querySelector('a').href = '#gamma';
     beta.after(gamma); event.target.remove();
   }
 });
</script></body></html>

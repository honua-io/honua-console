name: Console live AWS browser smoke

on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: console-live-aws-browser
  cancel-in-progress: false

jobs:
  operator-preflight:
    runs-on: ubuntu-latest
    outputs:
      provisioned: ${{ steps.operator-secrets.outputs.provisioned }}
    steps:
      - name: Check live AWS operator precondition
        id: operator-secrets
        shell: bash
        env:
          HONUA_CONSOLE_AWS_OPERATOR_USERNAME: ${{ secrets.HONUA_CONSOLE_AWS_OPERATOR_USERNAME }}
          HONUA_CONSOLE_AWS_OPERATOR_PASSWORD: ${{ secrets.HONUA_CONSOLE_AWS_OPERATOR_PASSWORD }}
        run: |
          if [[ -z "$HONUA_CONSOLE_AWS_OPERATOR_USERNAME" || -z "$HONUA_CONSOLE_AWS_OPERATOR_PASSWORD" ]]; then
            reason="FAILED: live-aws-browser requires HONUA_CONSOLE_AWS_OPERATOR_USERNAME and HONUA_CONSOLE_AWS_OPERATOR_PASSWORD. Missing operator secrets are not a pass. Configure both repository secrets for a provisioned AWS operator, then rerun the workflow."
            echo "::error::$reason"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          fi

  live-aws-browser:
    needs: operator-preflight
    if: needs.operator-preflight.outputs.provisioned == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: src/Honua.Console.Web/global.json

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x

      - name: Fetch digest-verified Cesium assets
        run: node scripts/fetch-cesium.mjs --force

      - name: Fetch the locked Studio release
        uses: ./.github/actions/fetch-studio-release

      - name: Restore and publish the static Console
        run: |
          cp src/Honua.Console.Web/global.json global.json
          dotnet restore Honua.Console.slnx --configfile NuGet.config --no-cache --locked-mode
          dotnet publish src/Honua.Console.Web/Honua.Console.Web.csproj -c Release -o artifacts/honua-console-web --no-restore --nologo --verbosity minimal -p:HonuaConsoleCommitSha=${{ github.sha }}

      - name: Verify published Cesium assets
        run: node scripts/verify-published-cesium.mjs artifacts/honua-console-web

      - name: Verify published Studio assets
        run: node scripts/fetch-studio-release.mjs --verify artifacts/honua-console-web/wwwroot/console/_studio

      - name: Build the non-shipping legacy regression fixture
        run: dotnet build tests/Honua.Console.LegacyHost/Honua.Console.LegacyHost.csproj -c Release --no-restore --nologo --verbosity minimal

      - name: Install Playwright
        working-directory: e2e/playwright
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium

      # Legacy server-auth regression against AWS; static WASM qualification runs separately.
      - name: Run the AWS-bound legacy Console journeys
        working-directory: e2e/playwright
        env:
          CI: "true"
          HONUA_CONSOLE_LEGACY_DLL: ${{ github.workspace }}/tests/Honua.Console.LegacyHost/bin/Release/net10.0/Honua.Console.LegacyHost.dll
          HONUA_CONSOLE_AWS_SERVER_URL: https://demo.honua.io
          HONUA_CONSOLE_AWS_OPERATOR_USERNAME: ${{ secrets.HONUA_CONSOLE_AWS_OPERATOR_USERNAME }}
          HONUA_CONSOLE_AWS_OPERATOR_PASSWORD: ${{ secrets.HONUA_CONSOLE_AWS_OPERATOR_PASSWORD }}
        run: npm run e2e:aws

      - name: Upload live AWS browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: console-live-aws-browser
          path: |
            e2e/playwright/.tmp/aws-console-report.json
            e2e/playwright/playwright-report
            e2e/playwright/test-results
          if-no-files-found: error
          include-hidden-files: true

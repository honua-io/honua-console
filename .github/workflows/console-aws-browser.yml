name: Console live AWS browser smoke

on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: console-live-aws-browser
  cancel-in-progress: false

jobs:
  operator-preflight:
    runs-on: ubuntu-latest
    outputs:
      provisioned: ${{ steps.operator-secrets.outputs.provisioned }}
    steps:
      - name: Check live AWS operator precondition
        id: operator-secrets
        shell: bash
        env:
          HONUA_CONSOLE_AWS_OPERATOR_USERNAME: ${{ secrets.HONUA_CONSOLE_AWS_OPERATOR_USERNAME }}
          HONUA_CONSOLE_AWS_OPERATOR_PASSWORD: ${{ secrets.HONUA_CONSOLE_AWS_OPERATOR_PASSWORD }}
        run: |
          if [[ -z "$HONUA_CONSOLE_AWS_OPERATOR_USERNAME" || -z "$HONUA_CONSOLE_AWS_OPERATOR_PASSWORD" ]]; then
            reason="SKIPPED: live-aws-browser requires HONUA_CONSOLE_AWS_OPERATOR_USERNAME and HONUA_CONSOLE_AWS_OPERATOR_PASSWORD; configure both repository secrets for a provisioned AWS operator, then rerun the workflow."
            echo "::notice::$reason"
            echo "$reason" >> "$GITHUB_STEP_SUMMARY"
            echo "provisioned=false" >> "$GITHUB_OUTPUT"
          else
            echo "provisioned=true" >> "$GITHUB_OUTPUT"
          fi

  live-aws-browser:
    needs: operator-preflight
    if: needs.operator-preflight.outputs.provisioned == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: src/Honua.Console.Web/global.json

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x

      - name: Fetch digest-verified Cesium assets
        run: node scripts/fetch-cesium.mjs --force

      - name: Restore and publish Console
        working-directory: src/Honua.Console.Web
        run: |
          dotnet restore Honua.Console.Web.csproj --configfile ../../NuGet.config --no-cache --locked-mode
          dotnet publish Honua.Console.Web.csproj -c Release -o ../../artifacts/honua-console-web --no-restore --nologo --verbosity minimal -p:HonuaConsoleCommitSha=${{ github.sha }}

      - name: Verify published Cesium assets
        run: node scripts/verify-published-cesium.mjs artifacts/honua-console-web

      - name: Install Playwright
        working-directory: e2e/playwright
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium

      - name: Run the AWS-bound Console journeys
        working-directory: e2e/playwright
        env:
          CI: "true"
          HONUA_CONSOLE_E2E_DLL: ${{ github.workspace }}/artifacts/honua-console-web/Honua.Console.Web.dll
          HONUA_CONSOLE_AWS_SERVER_URL: https://demo.honua.io
          HONUA_CONSOLE_AWS_OPERATOR_USERNAME: ${{ secrets.HONUA_CONSOLE_AWS_OPERATOR_USERNAME }}
          HONUA_CONSOLE_AWS_OPERATOR_PASSWORD: ${{ secrets.HONUA_CONSOLE_AWS_OPERATOR_PASSWORD }}
        run: npm run e2e:aws

      - name: Upload live AWS browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: console-live-aws-browser
          path: |
            e2e/playwright/.tmp/aws-console-report.json
            e2e/playwright/playwright-report
            e2e/playwright/test-results
          if-no-files-found: error
          include-hidden-files: true

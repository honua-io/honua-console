name: Console live AWS browser smoke

on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: read

concurrency:
  group: console-live-aws-browser
  cancel-in-progress: false

jobs:
  live-aws-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Authenticate GitHub Packages feed
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --configfile NuGet.config

      - name: Restore and publish Console
        run: |
          dotnet restore src/Honua.Console.Web/Honua.Console.Web.csproj
          dotnet publish src/Honua.Console.Web/Honua.Console.Web.csproj -c Release -o artifacts/honua-console-web --no-restore --nologo --verbosity minimal

      - name: Install Playwright
        working-directory: e2e/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run the AWS-bound Console journeys
        working-directory: e2e/playwright
        env:
          CI: "true"
          HONUA_CONSOLE_E2E_DLL: ${{ github.workspace }}/artifacts/honua-console-web/Honua.Console.Web.dll
          HONUA_CONSOLE_AWS_SERVER_URL: https://demo.honua.io
          HONUA_CONSOLE_AWS_ADMIN_KEY: ${{ secrets.HONUA_CONSOLE_AWS_ADMIN_KEY }}
        run: npm run e2e:aws

      - name: Upload live AWS browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-live-aws-browser
          path: |
            e2e/playwright/.tmp/aws-console-report.json
            e2e/playwright/playwright-report
            e2e/playwright/test-results
          if-no-files-found: error

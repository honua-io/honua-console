name: Console live AWS browser smoke

on:
  schedule:
    - cron: "23 17 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: console-live-aws-browser
  cancel-in-progress: false

jobs:
  gate-install-preflight:
    name: AWS gate browser qualification unavailable
    runs-on: ubuntu-latest
    steps:
      - name: Record missing Launch Stack gate
        shell: bash
        run: |
          reason="SKIPPED: AWS browser qualification awaits the first Launch Stack gate install with the candidate server image, published static Console, and stack-created Cognito test operator. No browser journey ran; this is not a live qualification pass."
          echo "::notice::$reason"
          echo "$reason" >> "$GITHUB_STEP_SUMMARY"

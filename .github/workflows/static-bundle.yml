name: Console static bundle

on:
  pull_request:
  # Each trunk commit gets a SHA-bound bundle the nightly release resolver can bind
  # (honua-release#1527); the Console has no container image since the static SPA ruling.
  push:
    branches: [trunk]
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  # A newer push to the same pull request cancels the run for the stale head.
  # Release and trunk runs get a unique group (run_id) and are never cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Publish static bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: src/Honua.Console.Web/global.json
      - name: Select the pinned SDK
        run: cp src/Honua.Console.Web/global.json global.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
      - name: Restore from public sources
        run: dotnet restore Honua.Console.slnx --configfile NuGet.config --no-cache --locked-mode
      - name: Fetch digest-verified Cesium assets
        run: node scripts/fetch-cesium.mjs --force
      - name: Fetch the locked Studio release
        id: studio
        uses: ./.github/actions/fetch-studio-release
      - name: Verify Studio build provenance
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.studio.outputs.archive }}
          LOCK: scripts/studio-release.lock.json
        run: |
          gh attestation verify "$ARCHIVE" \
            --repo honua-io/honua-studio \
            --signer-workflow honua-io/honua-studio/.github/workflows/release.yml \
            --source-ref "refs/tags/$(jq -r .tag "$LOCK")" \
            --source-digest "$(jq -r .sourceCommit "$LOCK")" \
            --deny-self-hosted-runners </dev/null
      - name: Publish trimmed WASM
        run: dotnet publish src/Honua.Console.Web/Honua.Console.Web.csproj -c Release --no-restore -o artifacts/static-publish
      - name: Verify published Cesium assets
        run: node scripts/verify-published-cesium.mjs artifacts/static-publish
      - name: Verify the published Content-Security-Policy
        run: node scripts/console-csp.mjs --check artifacts/static-publish/wwwroot/console/index.html
      - name: Verify published Studio assets
        run: node scripts/fetch-studio-release.mjs --verify artifacts/static-publish/wwwroot/console/_studio
      - name: Install browser test dependencies
        working-directory: e2e/playwright
        run: npm ci
      - name: Install Chromium
        working-directory: e2e/playwright
        run: npx --no-install playwright install --with-deps chromium
      - name: Verify static bundle boot and deep links at desktop and mobile widths
        working-directory: e2e/playwright
        env:
          CI: "true"
        run: npx --no-install playwright test --config playwright.static.config.ts
      - name: Upload static browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: console-static-browser
          path: |
            e2e/playwright/playwright-report/
            e2e/playwright/test-results/
          if-no-files-found: ignore
      - name: Package static files
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#v}"
          elif [ -z "$PR_NUMBER" ]; then
            version="0.0.0-trunk.${SOURCE_SHA:0:12}"
          else
            version="0.0.0-pr.${PR_NUMBER}"
          fi
          python3 scripts/package-console-static.py artifacts/static-publish/wwwroot/console --version "$version"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: console-static-release
          path: artifacts/static-release/*
          if-no-files-found: error

  release:
    name: Attach static release asset
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: console-static-release
          path: static-release
      - name: Attach versioned bundle and checksum receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" static-release/* </dev/null

  attest:
    # The nightly release lock verifies a trunk bundle by its publisher attestation
    # (honua-release mint_nightly_lock PUBLISHER_WORKFLOWS); only trunk pushes attest.
    name: Attest trunk bundle
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: console-static-release
          path: static-release
      - name: Check the bundle against its receipt
        id: bundle
        run: |
          receipt="$(ls static-release/honua-console-*.zip.json)"
          bundle="static-release/$(jq -r .asset "$receipt")"
          echo "$(jq -r .sha256 "$receipt")  $bundle" | sha256sum --check --strict
          echo "path=$bundle" >> "$GITHUB_OUTPUT"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.bundle.outputs.path }}
      # The release lock requires an SBOM statement beside provenance for every non-image
      # artifact. Start from the locked NuGet graph of the shipped projects under src/
      # (tests excluded), strip build-only NuGet packages (analyzers, ILLink, dev server),
      # and merge the bundled Studio release, Cesium assets, vendored JS libraries, and
      # .NET WASM runtime from the locked manifests and verified bundle ZIP.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: source
          sparse-checkout: |
            src
            scripts
            release/licenses
      # CycloneDX: actions/attest types SPDX as .../Document/v2.3, which the release
      # collector does not accept; it accepts https://cyclonedx.org/bom.
      - name: Generate the NuGet SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: source/src
          format: cyclonedx-json
          output-file: ${{ runner.temp }}/nuget.cdx.json
          syft-version: v1.57.2
          upload-artifact: false
          upload-release-assets: false
      - name: Merge bundled assets and filter build-only packages into the bundle SBOM
        env:
          BUNDLE_PATH: ${{ steps.bundle.outputs.path }}
        run: |
          python3 source/scripts/enrich-bundle-sbom.py \
            --sbom "${RUNNER_TEMP}/nuget.cdx.json" \
            --bundle "$BUNDLE_PATH" \
            --studio-lock source/scripts/studio-release.lock.json \
            --cesium-lock source/scripts/cesium-extracted-tree.lock.json \
            --vendored-lock source/scripts/vendored-assets.lock.json \
            --licenses-sources source/release/licenses/sources.json \
            --output "${RUNNER_TEMP}/bundle.cdx.json"
      - name: Refuse an SBOM without the NuGet graph and bundled assets
        run: |
          python3 - "${RUNNER_TEMP}/bundle.cdx.json" <<'PY'
          import json, sys
          bom = json.load(open(sys.argv[1], encoding="utf-8"))
          components = bom.get("components") or []
          purls = [str(c.get("purl", "")) for c in components]
          nuget = [p for p in purls if p.startswith("pkg:nuget/")]
          if bom.get("bomFormat") != "CycloneDX" or not nuget:
              raise SystemExit(f"{sys.argv[1]} is not a CycloneDX SBOM listing the NuGet graph")
          for label, prefix in (
              ("Studio", "pkg:github/honua-io/honua-studio@"),
              ("Cesium", "pkg:npm/cesium@"),
              (".NET WASM runtime", "pkg:nuget/Microsoft.NETCore.App.Runtime.Mono.browser-wasm@"),
          ):
              if not any(p.startswith(prefix) for p in purls):
                  raise SystemExit(f"{sys.argv[1]} is missing bundled component {label} ({prefix})")
          PY
      - uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: ${{ steps.bundle.outputs.path }}
          sbom-path: ${{ runner.temp }}/bundle.cdx.json

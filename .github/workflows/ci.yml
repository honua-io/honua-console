name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Console
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Restore .NET projects
        run: dotnet restore Honua.Console.slnx

      - name: Verify .NET formatting
        run: dotnet format Honua.Console.slnx --verify-no-changes --verbosity minimal --no-restore

      - name: Run .NET tests
        run: dotnet test tests/Honua.Console.Native.Core.Tests/Honua.Console.Native.Core.Tests.csproj --no-restore --nologo --verbosity minimal

      - name: Build Blazor Web host
        run: dotnet build src/Honua.Console.Web/Honua.Console.Web.csproj --no-restore --nologo --verbosity minimal

      - name: Validate Node lockfile
        run: npm ci

      - name: Run Node smoke and metadata tests
        run: npm test

      - name: Publish Blazor Web artifact
        run: dotnet publish src/Honua.Console.Web/Honua.Console.Web.csproj -c Release -o artifacts/honua-console-web --no-restore --nologo --verbosity minimal

      - name: Stamp artifact metadata
        run: npm run build:metadata
        env:
          HONUA_CONSOLE_ARTIFACT_DIR: artifacts/honua-console-web
          HONUA_CONSOLE_COMMIT_SHA: ${{ github.sha }}
          HONUA_CONSOLE_REF: ${{ github.ref_name }}

      # Contract-shape pre-check: the in-memory parity chain. Cheap and useful,
      # but per Console Patterns Charter §11 it does NOT satisfy the #9 gate.
      - name: Run parity contract-shape pre-check (non-gating)
        run: npm run smoke:parity

      # honua-console#9 real-server gate. The evidence above is mock-only, so
      # the gate is reported PENDING (blocked on honua-server#1162 +
      # honua-sdk-dotnet#166). --pending-ok keeps CI green while surfacing the
      # unmet gate as a warning; drop the flag once a real-server run lands and
      # emits sourceHydrated:true. See docs/smoke/real-server-gate.md.
      - name: "Evaluate honua-console#9 real-server gate"
        run: npm run smoke:gate -- --pending-ok smoke-evidence/console-parity.json

      - name: Upload Console artifact
        uses: actions/upload-artifact@v4
        with:
          name: honua-console-web
          path: artifacts/honua-console-web/
          if-no-files-found: error

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: console-parity-evidence
          path: smoke-evidence/console-parity.json
          if-no-files-found: ignore

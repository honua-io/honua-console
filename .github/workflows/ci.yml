name: CI

on:
  push:
    branches:
      - trunk
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  okf-bundle:
    name: OKF documentation bundle
    runs-on: ${{ vars.HONUA_LIGHT_RUNNER && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository) && fromJSON(vars.HONUA_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # docs/okf-bundle.v1.json declares which pages are published
      # documentation. The gate proves every page inside the boundary carries
      # valid Open Knowledge Format v0.2 frontmatter and that its relative
      # links resolve.
      - name: Verify the bundle
        run: python3 scripts/check-okf-bundle.py

      # SUMMARY.md is GitBook's table of contents, derived from the same
      # boundary. A page added to the bundle and not the TOC - or the reverse -
      # fails here rather than shipping a contents page that disagrees with
      # the bundle.
      - name: Verify the table of contents is derived
        run: python3 scripts/generate-summary.py --check

  studio-release-attestation:
    name: Verify Studio release attestation
    runs-on: ${{ vars.HONUA_LIGHT_RUNNER && (!github.event.pull_request || github.event.pull_request.head.repo.full_name == github.repository) && (!github.event.workflow_run || github.event.workflow_run.head_repository.full_name == github.repository) && fromJSON(vars.HONUA_LIGHT_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 10
    permissions:
      attestations: read
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Fetch the locked Studio release
        id: studio
        uses: ./.github/actions/fetch-studio-release

      # The repository and signer workflow are fixed here, so editing the lock selects a release but
      # cannot redirect trust; the tag and commit come from the lock.
      - name: Verify the release build-provenance attestation
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: ${{ steps.studio.outputs.archive }}
          LOCK: scripts/studio-release.lock.json
        run: |
          gh attestation verify "$ARCHIVE" \
            --repo honua-io/honua-studio \
            --signer-workflow honua-io/honua-studio/.github/workflows/release.yml \
            --source-ref "refs/tags/$(jq -r .tag "$LOCK")" \
            --source-digest "$(jq -r .sourceCommit "$LOCK")" \
            --deny-self-hosted-runners

  validate:
    name: Validate Console
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Enforce maintained documentation command policy
        run: |
          if git grep -n -i -w curl -- '*.md' '*.mdx' '*.rst' '*.txt'; then
            echo "::error::Maintained documentation must use supported SDK, CLI, or API-reference workflows."
            exit 1
          fi

      - name: Enforce public-content boundary
        run: npm run lint:public-content

      - name: Verify vendored honua-server ops parity map
        run: ./scripts/sync-ops-parity-map.sh --check

      - name: Check out the server import status contract
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: honua-io/honua-server
          ref: trunk
          path: .ci-server-import-contract
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: src/Honua.Core/Core/Features/Migration/Abstractions/GeoservicesImportProgress.cs

      - name: Verify import status wire values against the server
        run: >-
          node scripts/check-import-status-contract.mjs
          .ci-server-import-contract/src/Honua.Core/Core/Features/Migration/Abstractions/GeoservicesImportProgress.cs
          tests/Honua.Console.Shell.Tests/Fixtures/geoservices-import-status.json

      - name: Set up .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: src/Honua.Console.Web/global.json

      - name: Select the pinned SDK for solution commands
        run: cp src/Honua.Console.Web/global.json global.json

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
          cache: npm

      - name: Fetch the locked Studio release
        uses: ./.github/actions/fetch-studio-release

      # Every later dotnet step in this job resolves packages only from the clean,
      # anonymously restored cache below, never from a pre-populated global folder.
      - name: Isolate NuGet caches for the anonymous public restore
        run: |
          {
            echo "NUGET_PACKAGES=${RUNNER_TEMP}/honua-console-public-packages"
            echo "NUGET_HTTP_CACHE_PATH=${RUNNER_TEMP}/honua-console-public-http-cache"
            echo "NUGET_PLUGINS_CACHE_PATH=${RUNNER_TEMP}/honua-console-public-plugin-cache"
          } >> "$GITHUB_ENV"

      - name: Restore .NET projects anonymously from public sources
        run: dotnet restore Honua.Console.slnx --configfile NuGet.config --no-cache --locked-mode

      - name: Verify public package locks are current
        run: git diff --exit-code -- ':(glob)**/packages.lock.json'

      - name: Verify .NET formatting
        run: dotnet format Honua.Console.slnx --verify-no-changes --verbosity minimal --no-restore

      - name: Run .NET tests
        env:
          HONUA_CATALOG_PREVIEW_DIR: ${{ github.workspace }}/artifacts/catalog-preview
        # Coverage is collected for visibility only (uploaded as an artifact below);
        # there is no coverage threshold gate.
        run: dotnet test tests/Honua.Console.Shell.Tests/Honua.Console.Shell.Tests.csproj --no-restore --nologo --verbosity minimal --collect:"XPlat Code Coverage" --results-directory artifacts/test-results/shell

      - name: Verify diagnostic-bundle contract conformance
        # Executes the support-owned diagnostic-bundle v1 conformance manifest + valid/invalid
        # fixtures (mirrored read-only under contracts/diagnostics/) against the Console emitter and
        # validator, and enforces the pinned provenance SHA-256 (honua-console#307, honua-support#54/#57).
        # Contract drift — a tampered schema, a mismatched pin, or a diverged embedded copy — fails
        # here with a clear provenance/hash error, distinct from the general test lane above.
        run: dotnet test tests/Honua.Console.Shell.Tests/Honua.Console.Shell.Tests.csproj --no-build --no-restore --nologo --verbosity minimal --filter "FullyQualifiedName~DiagnosticBundle"

      - name: Run Console render + integration tests
        # Gates the bUnit component-render tests. The opt-in Testcontainers/live-server tests
        # skip cleanly here (HONUA_CONSOLE_RUN_LIVE_SERVER_TESTS is not set in CI); the nightly
        # console-nightly.yml lane runs those for real. Coverage is collected for visibility only.
        run: dotnet test tests/Honua.Console.IntegrationTests/Honua.Console.IntegrationTests.csproj --no-restore --nologo --verbosity minimal --collect:"XPlat Code Coverage" --results-directory artifacts/test-results/integration
        env:
          HONUA_CATALOG_PREVIEW_DIR: ${{ github.workspace }}/artifacts/catalog-preview

      - name: Fetch digest-verified Cesium assets
        # The Web project target also makes a direct local dotnet build/run/publish complete. Fetch
        # first here so the following build verifies the exact tree instead of fetching it twice.
        run: node scripts/fetch-cesium.mjs --force

      - name: Build Blazor Web host
        run: dotnet build src/Honua.Console.Web/Honua.Console.Web.csproj --no-restore --nologo --verbosity minimal

      - name: Validate Node lockfile
        run: npm ci

      - name: Run Node smoke and metadata tests
        run: npm test

      - name: Publish Blazor Web artifact
        run: dotnet publish src/Honua.Console.Web/Honua.Console.Web.csproj -c Release -o artifacts/honua-console-web --no-restore --nologo --verbosity minimal -p:HonuaConsoleCommitSha=${{ github.sha }}

      - name: Verify published Cesium assets
        run: node scripts/verify-published-cesium.mjs artifacts/honua-console-web

      - name: Verify published Studio assets
        run: node scripts/fetch-studio-release.mjs --verify artifacts/honua-console-web/wwwroot/console/_studio

      - name: Install catalog presentation browser checks
        run: |
          npm ci --prefix e2e/playwright
          cd e2e/playwright
          npx playwright install --with-deps chromium

      - name: Verify rendered catalog presentation
        run: node e2e/playwright/catalog-preview.mjs

      - name: Verify service navigation at scale
        run: node e2e/playwright/scale-preview.mjs

      - name: Upload scale navigation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: scale-navigation-presentation
          path: artifacts/catalog-preview/scale-*.png
          if-no-files-found: error

      - name: Verify rendered Share presentation
        run: node e2e/playwright/share-home-preview.mjs
        env:
          HONUA_CATALOG_PREVIEW_DIR: ${{ github.workspace }}/artifacts/catalog-preview

      - name: Upload Share overview presentation evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: share-overview-presentation
          path: artifacts/catalog-preview/share-home-*.png
          if-no-files-found: error

      - name: Verify rendered Share configuration presentation
        run: node e2e/playwright/share-manage-preview.mjs

name: CI

on:
  push:
    branches:
      - trunk
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Console
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm

      - name: Restore .NET projects
        run: dotnet restore Honua.Console.slnx

      - name: Verify .NET formatting
        run: dotnet format Honua.Console.slnx --verify-no-changes --verbosity minimal --no-restore

      - name: Run .NET tests
        # Coverage is collected for visibility only (uploaded as an artifact below);
        # there is no coverage threshold gate.
        run: dotnet test tests/Honua.Console.Native.Core.Tests/Honua.Console.Native.Core.Tests.csproj --no-restore --nologo --verbosity minimal --collect:"XPlat Code Coverage" --results-directory artifacts/test-results/native-core

      - name: Run Console render + integration tests
        # Gates the bUnit component-render tests. The opt-in Testcontainers/live-server tests
        # skip cleanly here (HONUA_CONSOLE_RUN_LIVE_SERVER_TESTS is not set in CI); the nightly
        # console-nightly.yml lane runs those for real. Coverage is collected for visibility only.
        run: dotnet test tests/Honua.Console.IntegrationTests/Honua.Console.IntegrationTests.csproj --nologo --verbosity minimal --collect:"XPlat Code Coverage" --results-directory artifacts/test-results/integration

      - name: Build Blazor Web host
        run: dotnet build src/Honua.Console.Web/Honua.Console.Web.csproj --no-restore --nologo --verbosity minimal

      - name: Validate Node lockfile
        run: npm ci

      - name: Run Node smoke and metadata tests
        run: npm test

      - name: Publish Blazor Web artifact
        run: dotnet publish src/Honua.Console.Web/Honua.Console.Web.csproj -c Release -o artifacts/honua-console-web --no-restore --nologo --verbosity minimal

      - name: Stamp artifact metadata
        run: npm run build:metadata
        env:
          HONUA_CONSOLE_ARTIFACT_DIR: artifacts/honua-console-web
          HONUA_CONSOLE_COMMIT_SHA: ${{ github.sha }}
          HONUA_CONSOLE_REF: ${{ github.ref_name }}

      - name: Run local parity smoke
        run: npm run smoke:parity

      - name: Upload Console artifact
        uses: actions/upload-artifact@v7
        with:
          name: honua-console-web
          path: artifacts/honua-console-web/
          if-no-files-found: error

      - name: Upload parity evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-parity-evidence
          path: smoke-evidence/console-parity.json
          if-no-files-found: ignore

      - name: Upload code coverage (cobertura)
        # Visibility only — no coverage threshold gate.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-coverage
          path: artifacts/test-results/**/coverage.cobertura.xml
          if-no-files-found: ignore

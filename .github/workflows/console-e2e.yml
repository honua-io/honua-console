name: Console E2E

# Thin real-browser Playwright smoke for the Honua Console Blazor Web host.
#
# This is a real signal: the job fails the run on any browser boot failure (asset 404,
# transport teardown, a re-introduced ambiguous route, or any console/page error). The
# ambiguous `/operate/jobs/{...}` circuit defect this smoke used to tolerate was fixed in
# #140, and the boot assertion was unblinded in #244 (app-shell.spec.ts now asserts zero
# console/page errors), so the previous `continue-on-error` escape hatch — which blinded the
# smoke to exactly the failures it exists to catch — has been removed (honua-console#239).
# Enforce it as a required check in branch protection.

on:
  push:
    branches:
      - trunk
      - main
  pull_request:

permissions:
  contents: read
  packages: read

concurrency:
  group: console-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: src/Honua.Console.Web/global.json

      - name: Select the pinned SDK for solution commands
        run: cp src/Honua.Console.Web/global.json global.json

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 20.x

      - name: Authenticate GitHub Packages feed
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --configfile NuGet.config

      - name: Restore .NET projects
        run: dotnet restore Honua.Console.slnx --locked-mode

      - name: Publish Blazor Web host
        run: dotnet publish src/Honua.Console.Web/Honua.Console.Web.csproj -c Release -o artifacts/honua-console-web --no-restore --nologo --verbosity minimal

      - name: Install Playwright dependencies
        working-directory: e2e/playwright
        run: npm ci

      - name: Install Playwright chromium
        working-directory: e2e/playwright
        run: npx --no-install playwright install --with-deps chromium

      - name: Run Console e2e smoke (chromium, headless)
        working-directory: e2e/playwright
        env:
          CI: "true"
          # Boot the published artifact instead of `dotnet run` (faster, matches the deployed binary).
          HONUA_CONSOLE_E2E_DLL: ${{ github.workspace }}/artifacts/honua-console-web/Honua.Console.Web.dll
        run: npx --no-install playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: console-e2e-playwright-report
          path: e2e/playwright/playwright-report/
          if-no-files-found: ignore

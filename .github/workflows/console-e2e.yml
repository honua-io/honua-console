name: Console E2E

# Thin real-browser Playwright smoke for the Honua Console Blazor Web host.
#
# This is a real signal: the job fails the run on any browser boot failure (asset 404,
# transport teardown, a re-introduced ambiguous route, or any console/page error). The
# ambiguous `/operate/jobs/{...}` circuit defect this smoke used to tolerate was fixed in
# #140, and the boot assertion was unblinded in #244 (app-shell.spec.ts now asserts zero
# console/page errors), so the previous `continue-on-error` escape hatch — which blinded the
# smoke to exactly the failures it exists to catch — has been removed (honua-console#239).
# Enforce it as a required check in branch protection.

on:
  push:
    branches:
      - trunk
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: console-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Restore .NET projects
        run: dotnet restore Honua.Console.slnx

      - name: Publish Blazor Web host
        run: dotnet publish src/Honua.Console.Web/Honua.Console.Web.csproj -c Release -o artifacts/honua-console-web --no-restore --nologo --verbosity minimal

      - name: Install Playwright dependencies
        working-directory: e2e/playwright
        run: npm ci

      - name: Install Playwright chromium
        working-directory: e2e/playwright
        run: npx playwright install --with-deps chromium

      - name: Run Console e2e smoke (chromium, headless)
        working-directory: e2e/playwright
        env:
          CI: "true"
          # Boot the published artifact instead of `dotnet run` (faster, matches the deployed binary).
          HONUA_CONSOLE_E2E_DLL: ${{ github.workspace }}/artifacts/honua-console-web/Honua.Console.Web.dll
        run: npx playwright test

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-e2e-playwright-report
          path: e2e/playwright/playwright-report/
          if-no-files-found: ignore

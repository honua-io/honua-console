name: Console Live Publish Journey
run-name: Console live ${{ inputs.suite || 'nightly' }} ${{ inputs.dispatch_id || github.run_id }}

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
    inputs:
      server_image:
        description: 'Optional immutable honua-server image@sha256 digest for diagnostic replay'
        required: false
        type: string
      console_image:
        description: 'Immutable Console GHCR digest; empty builds the checked-out PR image'
        required: false
        type: string
      dispatch_id:
        description: 'Unique release gate correlation ID'
        required: false
        type: string
      suite:
        description: 'Publish journey or the complete authenticated live suite'
        type: choice
        options: [publish-query, studio-customer, full]
        default: publish-query
  pull_request:
    paths:
      - '.github/workflows/console-live-journey.yml'
      - 'e2e/docker-compose*.yml'
      - 'e2e/playwright/live-auth/**'
      - 'e2e/initdb/**'
      - 'e2e/playwright/live/**'
      - 'e2e/playwright/playwright.live.config.ts'
      - 'src/Honua.Console.Web/**'
      - 'src/Honua.Console.Shell/**'
      - 'Dockerfile'

permissions:
  contents: read

concurrency:
  group: console-live-journey-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish-query:
    if: ${{ inputs.suite != 'studio-customer' }}
    name: Publish and query through a real server
    runs-on: ubuntu-latest
    # The publish journey finishes well inside 30 minutes. The complete authenticated suite runs
    # 87 cases serially with up to two retries each, and a 30-minute cap cancelled it before it
    # reported (run 39705471348), so `suite=full` could never produce a result.
    timeout-minutes: ${{ inputs.suite == 'full' && 120 || 30 }}
    env:
      CI: 'true'
      HONUA_CONSOLE_E2E_OIDC: 'true'
      HONUA_CONSOLE_E2E_LIVE_PORT: '5274'
      HONUA_CONSOLE_E2E_SERVER_IMAGE: ${{ inputs.server_image || vars.HONUA_CONSOLE_PR_SERVER_IMAGE || vars.HONUA_CONSOLE_NIGHTLY_SERVER_IMAGE || 'ghcr.io/honua-io/honua-server:nightly-aot' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: src/Honua.Console.Web/global.json
      - name: Select the pinned SDK
        run: cp src/Honua.Console.Web/global.json global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.x
      - name: Restore Console anonymously from public sources
        run: dotnet restore Honua.Console.slnx --configfile NuGet.config --no-cache --locked-mode
      - name: Install browser dependencies
        working-directory: e2e/playwright
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Validate explicit diagnostic image
        env:
          REQUESTED_IMAGE: ${{ inputs.server_image }}
        run: |
          python3 - <<'PY'
          import os, re
          requested = os.environ['REQUESTED_IMAGE']
          if requested and not re.fullmatch(r'ghcr\.io/honua-io/honua-server(?::[A-Za-z0-9_.-]+)?@sha256:[0-9a-f]{64}', requested):
              raise SystemExit('Explicit replay image must be an immutable honua-server GHCR digest')
          PY
      - name: Start authenticated server and seeded PostGIS
        run: |
          mkdir -p e2e/playwright/live-auth/certs
          bash e2e/playwright/live-auth/gen-certs.sh
          # The isolated test IdP runs as uid 1000 and must read its ephemeral key.
          sudo chown 1000:0 e2e/playwright/live-auth/certs/kc.key
          sudo chmod 640 e2e/playwright/live-auth/certs/kc.key
          docker compose -f e2e/docker-compose.yml -f e2e/docker-compose.auth.yml pull
          docker compose -f e2e/docker-compose.yml -f e2e/docker-compose.auth.yml up -d --wait --wait-timeout 300
          for attempt in {1..60}; do
            if curl --insecure --fail --silent https://127.0.0.1:8443/realms/honua/.well-known/openid-configuration > /dev/null; then
              break
            fi
            sleep 2
          done
          curl --insecure --fail --silent https://127.0.0.1:8443/realms/honua/.well-known/openid-configuration > /dev/null
          mkdir -p artifacts/live-journey
          docker image inspect "$HONUA_CONSOLE_E2E_SERVER_IMAGE" --format '{{json .RepoDigests}}' > artifacts/live-journey/server-digests.json
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8088/api/v1/admin/services)
          test "$status" = 401 || test "$status" = 403
      - name: Record observed diagnostic source and image identity
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          image = os.environ['HONUA_CONSOLE_E2E_SERVER_IMAGE']
          observed = json.loads(subprocess.check_output(['docker', 'image', 'inspect', image]))[0]
          source = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          receipt = {
              'scope': 'source-built Console diagnostic; not a published Console image qualification',
              'consoleSourceRevision': source,
              'serverImage': image,
              'serverRepoDigests': observed.get('RepoDigests', []),
              'serverSourceRevision': observed.get('Config', {}).get('Labels', {}).get('org.opencontainers.image.revision'),
              'runUrl': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          Path('artifacts/live-journey/replay-context.json').write_text(json.dumps(receipt, indent=2) + '\n')
          PY
      - name: Publish from Console and verify three seeded features
        if: ${{ inputs.suite != 'full' }}
        working-directory: e2e/playwright
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ../../artifacts/live-journey/playwright-results.json
        run: npx --no-install playwright test --config playwright.live.config.ts services-layers.live.spec.ts --grep 'publish a PostGIS table and verify via catalog, metadata, and a live query' --reporter=list,json > ../../artifacts/live-journey/playwright.log
      - name: Exercise the complete authenticated Console live suite
        if: ${{ inputs.suite == 'full' }}
        working-directory: e2e/playwright
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ../../artifacts/live-journey/playwright-results.json
        run: npx --no-install playwright test --config playwright.live.config.ts --reporter=list,json > ../../artifacts/live-journey/playwright.log
      - name: Retain server diagnostics
        if: always()
        run: |
          mkdir -p artifacts/live-journey
          docker compose -f e2e/docker-compose.yml -f e2e/docker-compose.auth.yml logs --no-color > artifacts/live-journey/containers.log
      - name: Stop the testbed
        if: always()
        run: docker compose -f e2e/docker-compose.yml -f e2e/docker-compose.auth.yml down -v
      - name: Upload journey evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: console-live-publish-journey
          path: |
            artifacts/live-journey/
            e2e/playwright/test-results/

  studio-customer:
    name: Studio customer journey on real images
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.suite == 'studio-customer' || inputs.suite == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CI: 'true'
      COMPOSE_PROJECT_NAME: studio-customer
      HONUA_CONSOLE_E2E_SERVER_IMAGE: ${{ inputs.server_image || vars.HONUA_CONSOLE_PR_SERVER_IMAGE || vars.HONUA_CONSOLE_NIGHTLY_SERVER_IMAGE || 'ghcr.io/honua-io/honua-server:nightly-aot' }}
      HONUA_CONSOLE_E2E_CONSOLE_IMAGE: ${{ inputs.console_image || 'honua-console:customer-pr' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: ${{ !inputs.console_image }}
        with:
          global-json-file: src/Honua.Console.Web/global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.x
      - name: Validate immutable replay inputs
        env:
          CONSOLE_IMAGE: ${{ inputs.console_image }}
          SERVER_IMAGE: ${{ inputs.server_image }}
        run: |
          python3 - <<'PYTHON'
          import os, re
          for component in ('console', 'server'):
              value = os.environ[component.upper() + '_IMAGE']
              if value and not re.fullmatch(r'ghcr\.io/honua-io/honua-' + component + r'(?::[A-Za-z0-9_.-]+)?@sha256:[0-9a-f]{64}', value):
                  raise SystemExit('Replay requires immutable Honua GHCR digests')
          if os.environ['CONSOLE_IMAGE'] and not os.environ['SERVER_IMAGE']:
              raise SystemExit('Console replay also requires a pinned server digest')
          PYTHON
      - name: Build the PR Console image
        if: ${{ !inputs.console_image }}
        run: |
          cp src/Honua.Console.Web/global.json global.json
          dotnet publish src/Honua.Console.Web/Honua.Console.Web.csproj -c Release -o artifacts/honua-console-web --locked-mode
          docker build --build-arg HONUA_CONSOLE_COMMIT_SHA="$GITHUB_SHA" --build-arg HONUA_CONSOLE_REF="$GITHUB_REF" -t "$HONUA_CONSOLE_E2E_CONSOLE_IMAGE" .
      - name: Install Chromium and axe
        working-directory: e2e/playwright
        run: |
          npm ci
          npx --no-install playwright install --with-deps chromium
      - name: Start real customer testbed
        run: |
          mkdir -p e2e/playwright/live-auth/certs artifacts/studio-customer
          bash e2e/playwright/live-auth/gen-certs.sh
          sudo chown 1000:0 e2e/playwright/live-auth/certs/kc.key
          sudo chmod 640 e2e/playwright/live-auth/certs/kc.key
          if [ "$HONUA_CONSOLE_E2E_CONSOLE_IMAGE" != honua-console:customer-pr ]; then
            docker pull "$HONUA_CONSOLE_E2E_CONSOLE_IMAGE"
          fi
          docker compose -f e2e/docker-compose.yml -f e2e/docker-compose.auth.yml -f e2e/docker-compose.studio-customer.yml up -d --wait --wait-timeout 300
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:5274/version.json > /dev/null; then break; fi
            sleep 2
          done
          for attempt in {1..60}; do
            if curl --insecure --fail --silent https://127.0.0.1:8443/realms/honua/.well-known/openid-configuration > /dev/null; then break; fi
            sleep 2
          done
          curl --insecure --fail --silent https://127.0.0.1:8443/realms/honua/.well-known/openid-configuration > /dev/null
          curl --fail --silent http://127.0.0.1:5274/version.json > artifacts/studio-customer/console-version.json
          node scripts/studio-customer-identity.mjs
      - name: Exercise the customer journey without mocks or skips
        working-directory: e2e/playwright
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: ../../artifacts/studio-customer/playwright-results.json
        run: npm run e2e:live -- --project=studio-customer --reporter=list,json
      - name: Retain customer evidence
        if: always()
        run: |
          mkdir -p artifacts/studio-customer
          docker compose -f e2e/docker-compose.yml -f e2e/docker-compose.auth.yml -f e2e/docker-compose.studio-customer.yml logs --no-color > artifacts/studio-customer/containers.log
      - name: Stop isolated customer testbed
        if: always()
        run: docker compose -f e2e/docker-compose.yml -f e2e/docker-compose.auth.yml -f e2e/docker-compose.studio-customer.yml down -v
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: studio-customer-journey-evidence
          if-no-files-found: error
          path: |
            artifacts/studio-customer/
            e2e/playwright/test-results/

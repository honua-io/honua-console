name: Console Container

on:
  push:
    branches:
      - trunk
      - main
  pull_request:
  workflow_dispatch:

# Pull requests receive read-only package access. The publishing job is excluded
# from pull_request events before its narrowly-scoped write token is issued.
permissions:
  contents: read
  packages: read

concurrency:
  group: console-container-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/honua-io/honua-console

jobs:
  validate:
    name: Build and smoke
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Authenticate GitHub Packages feed
        run: >-
          dotnet nuget update source github-honua
          --username "${{ github.actor }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --configfile NuGet.config

      - name: Restore Console
        run: dotnet restore Honua.Console.slnx

      - name: Publish Console artifact
        run: dotnet publish src/Honua.Console.Web/Honua.Console.Web.csproj -c Release -o artifacts/honua-console-web --no-restore --nologo --verbosity minimal

      - name: Stamp artifact metadata
        run: npm run build:metadata
        env:
          HONUA_CONSOLE_ARTIFACT_DIR: artifacts/honua-console-web
          HONUA_CONSOLE_COMMIT_SHA: ${{ github.sha }}
          HONUA_CONSOLE_REF: ${{ github.ref_name }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: ${{ env.IMAGE }}:pr-${{ github.event.number }}
          build-args: |
            HONUA_CONSOLE_COMMIT_SHA=${{ github.sha }}
            HONUA_CONSOLE_REF=${{ github.ref_name }}

      - name: Smoke-test the packaged Console
        shell: bash
        env:
          IMAGE_REF: ${{ env.IMAGE }}:pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 4174:8080 "${IMAGE_REF}")"
          cleanup() { docker rm --force "${container_id}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4174/version.json > /tmp/version.json; then
              break
            fi
            if [[ "${attempt}" == "30" ]]; then
              docker logs "${container_id}"
              exit 1
            fi
            sleep 2
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("/tmp/version.json").read_text(encoding="utf-8"))
          assert payload["name"] == "honua-console", payload
          assert payload["commit"] == os.environ["GITHUB_SHA"], payload
          assert set(payload["areas"]) == {"studio", "catalog", "operate", "share"}, payload
          PY

  publish:
    name: Build, smoke, and publish
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Authenticate GitHub Packages feed
        run: >-
          dotnet nuget update source github-honua
          --username "${{ github.actor }}"
          --password "${{ secrets.GITHUB_TOKEN }}"
          --store-password-in-clear-text
          --configfile NuGet.config

      - name: Restore Console
        run: dotnet restore Honua.Console.slnx

      - name: Publish Console artifact
        run: dotnet publish src/Honua.Console.Web/Honua.Console.Web.csproj -c Release -o artifacts/honua-console-web --no-restore --nologo --verbosity minimal

      - name: Stamp artifact metadata
        run: npm run build:metadata
        env:
          HONUA_CONSOLE_ARTIFACT_DIR: artifacts/honua-console-web
          HONUA_CONSOLE_COMMIT_SHA: ${{ github.sha }}
          HONUA_CONSOLE_REF: ${{ github.ref_name }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve immutable tags
        id: tags
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:12}"
          {
            echo "value<<EOF"
            echo "${IMAGE}:nightly"
            echo "${IMAGE}:nightly-${short_sha}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.value }}
          build-args: |
            HONUA_CONSOLE_COMMIT_SHA=${{ github.sha }}
            HONUA_CONSOLE_REF=${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          provenance: mode=max
          sbom: true

      - name: Verify published multi-architecture manifest
        run: docker buildx imagetools inspect "${IMAGE}@${{ steps.image.outputs.digest }}"

      - name: Smoke-test the published Console
        shell: bash
        env:
          IMAGE_REF: ${{ env.IMAGE }}@${{ steps.image.outputs.digest }}
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 4174:8080 "${IMAGE_REF}")"
          cleanup() { docker rm --force "${container_id}" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:4174/version.json > /tmp/version.json; then
              break
            fi
            if [[ "${attempt}" == "30" ]]; then
              docker logs "${container_id}"
              exit 1
            fi
            sleep 2
          done

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path("/tmp/version.json").read_text(encoding="utf-8"))
          assert payload["name"] == "honua-console", payload
          assert payload["commit"] == os.environ["GITHUB_SHA"], payload
          assert set(payload["areas"]) == {"studio", "catalog", "operate", "share"}, payload
          PY

      - name: Attest published image provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Record immutable image coordinates
        run: |
          {
            echo "## Honua Console image"
            echo
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Image: \`${IMAGE}@${{ steps.image.outputs.digest }}\`"
            echo "- Platforms: \`linux/amd64\`, \`linux/arm64\`"
          } >> "$GITHUB_STEP_SUMMARY"

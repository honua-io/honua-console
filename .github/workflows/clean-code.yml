name: Clean code

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

# No concurrency group: this is a required check, and a cancelled run left as the
# newest check run of that name blocks merging even when another run passed (a rerun
# of an older run cancels the newer one). Runs take seconds, so every run completes.

jobs:
  clean-code:
    uses: honua-io/.github/.github/workflows/clean-code.yml@7e93a67a13dc498cc4e5032f00cd9e93171afb95 # v1.2.0 + light runner switch
    with:
      frozen: |
        **/*Shims.cs

name: Console Live-LLM Smoke (nightly)

# Non-blocking nightly lane that exercises REAL AI generation through the console
# studio generate-from-prompt surfaces (QUERY / MAP / FORM / WORKFLOW) against a
# LOCAL honua-server wired to a real provider. Because LLM output is
# non-deterministic, assertions are tolerant ("a coherent generated result
# appeared"). This is a signal lane, NOT a PR-required check: it only runs on a
# schedule and on manual dispatch, and it NEVER runs on pull_request/push.
#
# Credential gating (resolved by e2e/run-live-llm.mjs from the env below):
#   - HONUA_LIVE_LLM_OPENAI_API_KEY secret set  -> direct OpenAI-compatible, all 4 surfaces.
#   - HONUA_LIVE_LLM_AWS_* secrets set           -> Bedrock via a LiteLLM sidecar, all 4 surfaces.
#   - neither                                    -> gated mode: every spec skips, job stays green.
# The lane never fails for missing credentials — only for a genuine generation regression.

on:
  schedule:
    # 05:41 UTC daily (off the hour to dodge the cron stampede).
    - cron: "41 5 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Force provider mode: openai | bedrock | none (blank = auto-resolve from secrets)."
        required: false
        type: string
      server_image:
        description: "honua-server image to pin (overrides the HONUA_LIVE_LLM_SERVER_IMAGE repo variable)."
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: console-live-llm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live-llm:
    name: Live-LLM smoke (real AI generation)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # Pinned, override-able honua-server image (dispatch input > repo var > literal).
      HONUA_LIVE_LLM_SERVER_IMAGE: ${{ github.event.inputs.server_image || vars.HONUA_LIVE_LLM_SERVER_IMAGE || 'ghcr.io/honua-io/honua-server:nightly' }}
      # Provider credentials — empty when the secret is unset; the orchestrator
      # then resolves mode=none and the lane skips cleanly (non-blocking).
      HONUA_LIVE_LLM_MODE: ${{ github.event.inputs.mode }}
      HONUA_LIVE_LLM_OPENAI_API_KEY: ${{ secrets.HONUA_LIVE_LLM_OPENAI_API_KEY }}
      HONUA_LIVE_LLM_OPENAI_MODEL: ${{ vars.HONUA_LIVE_LLM_OPENAI_MODEL }}
      HONUA_LIVE_LLM_OPENAI_ENDPOINT: ${{ vars.HONUA_LIVE_LLM_OPENAI_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.HONUA_LIVE_LLM_AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HONUA_LIVE_LLM_AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.HONUA_LIVE_LLM_AWS_SESSION_TOKEN }}
      AWS_REGION: ${{ vars.HONUA_LIVE_LLM_AWS_REGION || 'us-west-2' }}
      HONUA_LIVE_LLM_BEDROCK_MODEL: ${{ vars.HONUA_LIVE_LLM_BEDROCK_MODEL }}
      DOTNET_NOLOGO: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Authenticate GitHub Packages feed
        run: dotnet nuget update source github-honua --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" --store-password-in-clear-text --configfile NuGet.config

      - name: Restore Console Web project
        run: dotnet restore src/Honua.Console.Web/Honua.Console.Web.csproj

      - name: Install Playwright (Chromium)
        working-directory: e2e/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Pre-pull honua-server image
        run: docker pull "${HONUA_LIVE_LLM_SERVER_IMAGE}"

      # Runs the whole lane: resolve provider -> stack up -> Console up -> specs ->
      # teardown. Writes the surface summary to $GITHUB_STEP_SUMMARY itself.
      - name: Run live-LLM smoke lane
        run: node e2e/run-live-llm.mjs

      - name: Upload Playwright report + surface ledger
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: console-live-llm-report
          path: |
            e2e/playwright/live-llm/results/**
            e2e/playwright/playwright-report/**
          if-no-files-found: warn
